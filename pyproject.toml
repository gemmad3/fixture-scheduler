[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixture-scheduler"
version = "0.1.0"
description = "Round-robin sports fixture generation, standard library only"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "gemmad3" }]

[tool.setuptools.packages.find]
include = ["fixture_scheduler*"]
